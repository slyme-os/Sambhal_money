name: Android

# Builds the Sambhal Android app on every push.
#  - sambhal-apk-<n>: the "sideload" APK. No SMS permission, so Play Protect lets it
#    install from a file on any phone. Signed with the fixed debug key, so each new APK
#    installs over the last one.
#  - sambhal-play-debug-apk-<n>: the "play" build with automatic SMS reading, for
#    testing only (sideloading it is blocked while Play Protect is on).
# If the upload-key secrets are set, it also builds the signed Play Store AAB.

on:
  push:
    branches: [feat/gmoney-mvp, main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - name: Build web app (static export) and copy into Android
        run: npm run android:sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build APKs (sideload + play debug)
        working-directory: android
        run: ./gradlew assembleSideloadDebug assemblePlayDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sambhal-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/sideload/debug/app-sideload-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: sambhal-play-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error

      - name: Build signed release (AAB + APK)
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          ./gradlew bundlePlayRelease assembleSideloadRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: sambhal-release-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/playRelease/app-play-release.aab
            android/app/build/outputs/apk/sideload/release/app-sideload-release.apk
